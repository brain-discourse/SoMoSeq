# use this config template and fill in the values for your proj/env

# --------------------- PREPROCESSING ----------------------------------------
# preprocessing in this project is done at lane level where each lane corresponds to a 384 nuclei pool run on one lane of NovaseqS4
# parent dir with lane/sample specific input fastqs and/or intermediate files
RAW_DATA_DIR: /path/to/data/<lane_or_sample_id>

# STAR genome index (built ahead of time; see zUMIs_wiki: https://github.com/sdparekh/zUMIs/wiki/Usage#preparing-star-index-for-mapping for instructions)
STAR_INDEX: /path/to/STAR_index_GRCh38_gencode_v32

# GTF annotation (same as the one used to build STAR index)
GTF_FILE: /path/to/gencode.v32.primary_assembly.annotation.gtf

# Output directory
OUT_DIR: /path/to/output/<lane_id>

# Local zUMIs env (https://github.com/sdparekh/zUMIs).
ZUMIS_INSTALL_DIR: /path/to/zUMIs

# R library path used by zUMIs env
R_LIBS_USER: /path/to/R/library

# --------------------- snRNA-seq DATA ANAYLSIS ----------------------------------------
# Paths are relative and load files from the [Zenodo deposit](https://doi.org/10.5281/zenodo.23488443)
zenodo_root: "/path/to/data/SoMoSeq_v2_2026_10_19"

# Working directory
work_dir: "/path/to/work"

# MSigDB v2024.1 human gene-symbol GMT files
msigdb_dir: "/path/to/data/gene_sets/msigdb_v2024.1.Hs"

# Epilepsy / cortical-malformation HPO gene-set GMT
epilepsy_gmt: "/path/to/data/gene_sets/epilepsy_gene_list.gmt"

# Optional: SingleR reference objects (SingleCellExperiment or Seurat RDS).
# Leave empty to use the deposited SingleR predictions instead.
ref_siletti: ""
ref_developmental: ""
ref_ss2: ""
